name: 🐞 Fehler melden
description: Etwas funktioniert nicht wie erwartet.
labels: [fehler]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden! Bitte verrate keine Inhalte kommender Türchen 🤫
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was hast du erwartet und was ist stattdessen passiert?
    validations:
      required: true
  - type: input
    id: ha-version
    attributes:
      label: Version von Home Assistant
      description: Einstellungen → Info, z. B. 2026.11.2
    validations:
      required: true
  - type: input
    id: karten-version
    attributes:
      label: Version der Karte
      description: In HACS bei „Adventskalender Card“ oder im Release-Namen, z. B. v1.0.0
    validations:
      required: true
  - type: dropdown
    id: geraet
    attributes:
      label: Wo tritt es auf?
      multiple: true
      options:
        - Browser am PC
        - Browser am Handy/Tablet
        - Companion-App Android
        - Companion-App iOS
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: z. B. Chrome 131, Firefox, Safari
  - type: textarea
    id: config
    attributes:
      label: Karten-Konfiguration (YAML)
      description: Dashboard bearbeiten → Karte → ⋮ → Im Code-Editor anzeigen. Entitäten darfst du gern umbenennen.
      render: yaml
  - type: textarea
    id: log
    attributes:
      label: Fehlermeldung oder Bildschirmfoto
      description: Fehlermeldung der Karte, Meldungen aus der Browser-Konsole (F12) oder ein Bildschirmfoto hier hineinziehen.
